<script>
var EQ=null,CVG=null,SCRUB=false,D=null,RANGE="live",TZ="Europe/Athens",ACTS=[],RN={SNIPER:"Sniper",MOMENTUM:"Momentum",DIP_HUNTER:"Dip Hunter",COPY:"Copier"},RC={SNIPER:"#FF9F0A",MOMENTUM:"#34C759",DIP_HUNTER:"#FF375F",COPY:"#007AFF"},STOP={SNIPER:25,MOMENTUM:20,DIP_HUNTER:15,COPY:25};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

 return'<span class="tk" style="width:'+sz+'px;height:'+sz+'px;background:'+c+';font-size:'+Math.round(sz*.42)+'px">'+l+(addr?'<img src="https://dd.dexscreener.com/ds-data/tokens/solana/'+esc(addr)+'.png?size=lg" onerror="this.remove()" alt="">':"")+'</span>'}

/* balance chart: smooth line, dots at trades, pill tags, dotted drop lines */
function drawEq(){var d=D,now=Date.now(),span={live:6*3600e3,"1h":3600e3,"4h":4*3600e3,"1d":864e5,"1w":7*864e5,all:1e13}[RANGE];
 var pts=d.equity_series.map(function(e){return[ts(e.t),e.equity]}).filter(function(p){return p[0]>=now-span&&!isNaN(p[0])});

 var col=d.equity>=pts[0][1]?"#34C759":"#FF3B30";
