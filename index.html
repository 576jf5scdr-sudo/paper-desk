<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Paper Desk</title>
<style>
:root{--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--t:#fff;--g:#8E8E93;--gr:#34C759;--r:#FF3B30;--o:#FF9F0A;--b:#007AFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{padding-top:calc(env(safe-area-inset-top) + 78px);padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}
a{color:inherit;text-decoration:none}
header{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(0,0,0,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.title{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr)}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(52,199,89,.16);color:var(--gr);display:flex;align-items:center;gap:6px}
.pill.off{background:var(--card2);color:var(--g)}.pill.off .dot{background:var(--g);box-shadow:none}
.sub{color:var(--g);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{display:none;padding:0 16px}.page.on{display:block}
.bal{font-size:48px;font-weight:800;letter-spacing:-1.5px;margin-top:10px;display:flex;line-height:1.1}
.odo{display:inline-block;height:1.1em;overflow:hidden;position:relative}
.odo span{display:block;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.odo span b{display:block;height:1.1em;font-weight:800}
.chg{font-size:16px;font-weight:600;margin-top:4px}.up{color:var(--gr)}.dn{color:var(--r)}.mut{color:var(--g)}
.chart{position:relative;margin:14px -16px 0;height:230px}.chart svg{width:100%;height:100%;display:block;overflow:visible}
.ann{position:absolute;transform:translate(-50%,-130%);font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap;pointer-events:none}
.ann.b{background:var(--b)}.ann.g{background:var(--gr);color:#000}.ann.r{background:var(--r)}
.tabs{display:flex;justify-content:space-between;margin:8px 0 22px}
.tabs button{background:none;border:0;color:var(--g);font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:999px}
.tabs button.on{background:var(--card2);color:#fff}.tabs button.on.live{color:var(--gr)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}.sh h2{font-size:20px;margin:0;font-weight:700}.sh span{font-size:14px;font-weight:600}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.ag{flex:0 0 150px;background:var(--card);border-radius:18px;padding:14px}
.ag .n{font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.ag .v{font-size:24px;font-weight:800;margin:10px 0 2px}.ag .d{font-size:12px;color:var(--g)}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #2c2c2e;align-items:center}.row:last-child{border:0}
.ic{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.ic.b{background:rgba(0,122,255,.18);color:var(--b)}.ic.s{background:rgba(52,199,89,.16);color:var(--gr)}.ic.l{background:rgba(255,59,48,.16);color:var(--r)}
.rm{flex:1;min-width:0}.rm .a,.rm .c{display:flex;justify-content:space-between;gap:8px}.rm .a{font-weight:600;font-size:15px}.rm .c{font-size:13px;color:var(--g);margin-top:2px}.rm .e{font-size:12px;color:#636366;margin-top:2px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:15px}.kv span:first-child{color:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(18,18,18,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #2c2c2e;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--g);font:600 11px inherit;font-family:inherit;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}nav button.on{color:#fff}
#det{position:fixed;inset:0;z-index:40;background:#000;overflow-y:auto;transform:translateX(100%);transition:transform .3s;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#det.on{transform:none}
.back{background:none;border:0;color:var(--b);font:600 17px inherit;font-family:inherit;padding:0 0 10px}
.cname{font-size:28px;font-weight:800}.big{font-size:40px;font-weight:800;margin-top:12px;letter-spacing:-1px}
#cv{width:100%;height:260px;display:block;margin:12px 0}
.btn{display:block;text-align:center;background:var(--b);color:#fff;font-weight:700;border-radius:14px;padding:14px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}.grid .l{color:var(--g);font-size:13px}.grid .v{font-size:18px;font-weight:700;margin-top:4px}
.risk{background:rgba(255,159,10,.12);color:var(--o);border-radius:18px;padding:14px 16px;font-weight:600;font-size:14px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:60;background:rgba(44,44,46,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:12px 16px;font-size:14px;font-weight:600;transform:translateY(-150%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#toast.on{transform:none}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 84px);left:50%;transform:translate(-50%,-80px);z-index:25;background:var(--card2);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;opacity:0;transition:opacity .2s}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.ring{position:relative;width:34px;height:34px;flex:0 0 34px}.ring svg{width:34px;height:34px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.ag .top{display:flex;justify-content:space-between;align-items:center}
.tbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:29;display:flex;gap:8px;align-items:center;background:#1C1C1E;border:1px solid #2c2c2e;border-radius:22px;padding:6px 6px 6px 16px}
.tbar input{flex:1;background:none;border:0;color:#fff;font:16px inherit;font-family:inherit;outline:none;min-width:0}.tbar input::placeholder{color:#8E8E93}
.tbar button{width:34px;height:34px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:18px;font-weight:800}
body.hastbar{padding-bottom:calc(env(safe-area-inset-bottom) + 130px)}
.bub{max-width:80%;padding:10px 14px;border-radius:20px;margin:6px 0;font-size:15px;line-height:1.35;word-wrap:break-word}
.bub.me{margin-left:auto;background:var(--b);border-bottom-right-radius:6px}.bub.bot{background:#2C2C2E;border-bottom-left-radius:6px}
.bt{font-size:11px;color:#636366;margin:0 4px}.bt.me{text-align:right}
.ctx{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;font-size:13px;margin:10px 0}
.av{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px}
.tk{position:relative;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#000;overflow:hidden}.tk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .tkw{position:relative}.row .badge{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;border:2px solid #1C1C1E;display:flex;align-items:center;justify-content:center}
.dhead{display:flex;align-items:center;gap:12px}
.empty{padding:16px;color:var(--g);font-size:14px}
</style></head><body class="hastbar">
<header><div class="hrow"><div class="title" id="ttl">Paper Desk</div><div id="live" class="pill"><i class="dot"></i><span>Live</span></div></div><div class="sub" id="subh">loading…</div></header>
<div id="ptr">↓ Pull to refresh</div><div id="toast"></div><canvas id="cf"></canvas>

<section class="page on" id="p-home">
 <div class="bal" id="bal"></div><div class="chg" id="chg"></div>
 <div class="chart" id="eq"></div>
 <div class="tabs" id="tabs"><button class="on live" data-r="live">• LIVE</button><button data-r="1h">1H</button><button data-r="4h">4H</button><button data-r="1d">1D</button><button data-r="1w">1W</button><button data-r="all">ALL</button></div>
 <div class="sh"><h2>Agents</h2><span class="up" id="nrun"></span></div><div class="hs" id="agents"></div>
 <div class="sh"><h2>Activity</h2><span style="color:var(--b)" onclick="go('act')">See all</span></div><div class="list" id="act5"></div>
</section>
<section class="page" id="p-agents"><div class="sh"><h2>Agents</h2><span class="up" id="nrun2"></span></div><div id="agentsL"></div></section>
<section class="page" id="p-act"><div class="sh"><h2>Activity</h2></div><div class="list" id="actAll"></div></section>
<section class="page" id="p-task"><div id="chat"></div><div class="mut" style="font-size:12px;text-align:center;margin:14px 0">Saved on this phone only. Nothing is sent to the desk automatically (there is no backend). Tell me in chat to apply it.</div></section>
<section class="page" id="p-acct"><div class="sh"><h2>Account</h2></div><div id="acct"></div></section>

<div id="det"></div><form class="tbar" id="tbar"><input id="tin" placeholder="Give Grok Bot a task..." autocomplete="off" enterkeyhint="send"><button type="submit">↑</button></form>
<nav id="nav">
 <button class="on" data-p="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg> Home</button>
 <button data-p="task"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="7" width="16" height="12" rx="4"/><rect x="11" y="2.5" width="2" height="4"/><circle cx="12" cy="2.5" r="1.6"/><circle cx="9" cy="13" r="1.7" fill="#000"/><circle cx="15" cy="13" r="1.7" fill="#000"/><rect x="1.5" y="11" width="2" height="4" rx="1"/><rect x="20.5" y="11" width="2" height="4" rx="1"/></svg> Grok Bot</button>
 <button data-p="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="4" cy="12" r="1.3" fill="currentColor"/><circle cx="4" cy="18" r="1.3" fill="currentColor"/></svg> Activity</button>
 <button data-p="acct"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-4.4 4-7 9-7s9 2.6 9 7z"/></svg> Account</button>
 <button data-p="agents" style="display:none"></button>
</nav>
<script>
var PAGE="home",D=null,RANGE="live",TZ="Europe/Athens",RN={SNIPER:"Sniper",MOMENTUM:"Momentum",DIP_HUNTER:"Dip Hunter",COPY:"Copier"},STOP={SNIPER:25,MOMENTUM:20,DIP_HUNTER:15,COPY:25};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(v,d){return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function sh(a){return a?a.slice(0,4)+"…"+a.slice(-4):""}
function ts(s){if(!s)return NaN;if(/T/.test(s))return Date.parse(s);return Date.parse(s.replace(" ","T")+":00+02:00")}
function at(t){return new Date(t).toLocaleString("en-GB",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" Athens"}
function px(v){if(!v)return"$0";return v>=1?"$"+v.toFixed(4):"$"+Number(v).toPrecision(4)}
function kfmt(v){if(v==null)return"—";return v>=1e6?"$"+(v/1e6).toFixed(2)+"M":v>=1e3?"$"+(v/1e3).toFixed(1)+"K":"$"+Math.round(v)}
function go(p){PAGE=p;hdr();document.body.classList.toggle("hastbar",p=="home"||p=="task");$("tbar").style.display=(p=="home"||p=="task")?"flex":"none";if(p=="task")chat();document.querySelectorAll(".page").forEach(function(e){e.classList.toggle("on",e.id=="p-"+p)});document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.p==p)});scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.p)}});
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#tabs button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");RANGE=b.dataset.r;drawEq()}});

function hdr(){if(!D)return;var live=Date.now()-ts(D.last_scan)<20*60e3,fw=(D.copy&&D.copy.followed)||[];
 if(PAGE=="task"){$("ttl").innerHTML='Grok Bot <span class="mut">›</span>';$("live").lastChild.textContent=live?"Ready":"Paused";$("subh").textContent="connected · "+money(D.equity)+" paper book"}
 else{$("ttl").textContent="Paper Desk";$("live").lastChild.textContent=live?"Live":"Paused";$("subh").textContent=(fw.length?"copying "+fw.map(function(w){return sh(w.address)}).join(" · "):"no wallets followed")+" · "+D.open_count+" open"}
 $("live").className="pill"+(live?"":" off")}
function msgs(){try{return JSON.parse(localStorage.pdTasks||"[]")}catch(e){return[]}}
function chat(){var m=msgs();$("chat").innerHTML=m.length?m.map(function(x){return'<div class="bub me">'+esc(x.text)+'</div><div class="bt me">'+at(x.t)+'</div><div class="bub bot">Saved. I\'ll apply this on the desk.</div>'}).join(""):'<div class="bub bot">Hi G. Type a task for the desk below. It is saved here so you can send it to me in chat.</div>';setTimeout(function(){scrollTo(0,document.body.scrollHeight)},50)}
$("tbar").onsubmit=function(e){e.preventDefault();var v=$("tin").value.trim();if(!v)return;var m=msgs();m.push({text:v,t:Date.now()});localStorage.pdTasks=JSON.stringify(m.slice(-50));$("tin").value="";go("task")};
var SV={eye:'<path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>',copy:'<path d="M8 3h11a2 2 0 0 1 2 2v11h-2V5H8z"/><rect x="3" y="7" width="14" height="14" rx="2"/>',target:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>',shield:'<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>',warn:'<path d="M12 2 1 21h22z"/><path d="M12 9v5" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="#000"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',check:'<circle cx="12" cy="12" r="10"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>',up:'<path d="M12 4 5 11h4.5v9h5v-9H19z"/>',dn:'<path d="M12 20l7-7h-4.5V4h-5v9H5z"/>'};
function ico(n,col,sz){return'<svg viewBox="0 0 24 24" width="'+(sz||16)+'" height="'+(sz||16)+'" fill="'+(col||"currentColor")+'" style="vertical-align:-3px;flex:0 0 auto">'+SV[n]+'</svg>'}
function av(n,col){return'<span class="av" style="background:'+col+'26;color:'+col+'">'+ico(n,col,18)+'</span>'}
function tokImg(addr,coin,sz){var c=["#FF9F0A","#007AFF","#34C759","#AF52DE","#FF375F"][(coin||"?").charCodeAt(0)%5],l=esc((coin||"?").slice(0,1).toUpperCase());
 return'<span class="tk" style="width:'+sz+'px;height:'+sz+'px;flex:0 0 '+sz+'px;background:'+c+';font-size:'+Math.round(sz*.42)+'px">'+l+(addr?'<img src="https://dd.dexscreener.com/ds-data/tokens/solana/'+esc(addr)+'.png?size=lg" onerror="this.remove()" alt="">':"")+'</span>'}
/* odometer */
var lastBal=null;
function odo(v){var s=money(v),el=$("bal");
 if(el.childNodes.length!==s.length){el.innerHTML=s.split("").map(function(c){return /\d/.test(c)?'<span class="odo"><span>'+"0123456789".split("").map(function(d){return"<b>"+d+"</b>"}).join("")+'</span></span>':"<span>"+c+"</span>"}).join("")}
 var i=0;s.split("").forEach(function(c,k){var n=el.childNodes[k];if(/\d/.test(c)){var inner=n.firstChild;requestAnimationFrame(function(){inner.style.transform="translateY(-"+(+c*1.1)+"em)"})}else n.textContent=c})}

function feedTs(f){return ts(f.ts||f.t)}
function render(){
 var d=D,last=ts(d.last_scan),live=Date.now()-last<20*60e3;
 hdr();
 odo(d.equity);var diff=d.equity-d.start,pct=diff/d.start*100;
 $("chg").className="chg "+(diff>=0?"up":"dn");$("chg").textContent=(diff>=0?"↑ ":"↓ ")+money(Math.abs(diff))+" ("+Math.abs(pct).toFixed(1)+"%) · "+d.multiple.toFixed(2)+"x";
 drawEq();agents();activity();acct();notify();
}
/* equity chart */
function drawEq(){var d=D,now=Date.now(),span={live:3*3600e3,"1h":3600e3,"4h":4*3600e3,"1d":864e5,"1w":7*864e5,all:1e13}[RANGE];
 var pts=d.equity_series.map(function(e){return[ts(e.t),e.equity]}).filter(function(p){return p[0]>=now-span});
 pts.push([now,d.equity]);if(pts.length<2)pts.unshift([now-span,pts[0][1]]);
 var W=$("eq").clientWidth||360,H=230,t0=pts[0][0],t1=now,lo=Math.min.apply(0,pts.map(function(p){return p[1]})),hi=Math.max.apply(0,pts.map(function(p){return p[1]}));
 if(hi-lo<1){hi+=1;lo-=1}var pad=(hi-lo)*.15;lo-=pad;hi+=pad;
 function X(t){return (t-t0)/(t1-t0||1)*W}function Y(v){return 20+(1-(v-lo)/(hi-lo))*(H-40)}
 var col=d.equity>=pts[0][1]?"#34C759":"#FF3B30",path=pts.map(function(p,i){return(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)}).join("");
 var h='<svg viewBox="0 0 '+W+' '+H+'"><defs><filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".25"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
 '<path d="'+path+'L'+W+','+H+'L0,'+H+'Z" fill="url(#fa)"/><path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2.5" filter="url(#gl)" stroke-linejoin="round"/>'+
 '<circle cx="'+X(now)+'" cy="'+Y(d.equity)+'" r="4.5" fill="'+col+'" filter="url(#gl)"/></svg>';
 /* annotations: real trades in range, last 5 */
 var ev=d.feed.filter(function(f){var t=feedTs(f);return(f.kind=="buy"||f.kind=="sell")&&t>=t0}).slice(0,5),anns="";
 function eqAt(t){var v=pts[0][1];pts.forEach(function(p){if(p[0]<=t)v=p[1]});return v}
 ev.forEach(function(f){var t=feedTs(f),m=/\$(-?[\d.,]+)/.exec(f.text||""),pn=f.pnl,lab,c;
  if(f.kind=="buy"){lab="BOUGHT "+f.coin;c="b"}else{var ct=d.closed_trades.find(function(x){return x.coin==f.coin&&Math.abs(ts(x.ts)-t)<15*60e3});pn=ct?ct.pnl:null;if(pn==null)return;lab=(pn>=0?"+":"-")+money(Math.abs(pn));c=pn>=0?"g":"r"}
  anns+='<div class="ann '+c+'" style="left:'+Math.min(W-40,Math.max(40,X(t)))+'px;top:'+Y(eqAt(t))+'px">'+esc(lab)+'</div>'});
 $("eq").innerHTML=h+anns}
/* agents */
function copyStats(){var c=D.closed_trades.filter(function(x){return x.role=="COPY"&&x.final!==false}),o=D.open_positions.filter(function(p){return p.role=="COPY"});return{closed:c.length,open:o.length,pnl:c.reduce(function(a,b){return a+(b.pnl||0)},0)}}
