<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Desk</title>
<meta name="description" content="Paper (simulated) memecoin trading desk. Practice money only.">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Desk">
<meta name="format-detection" content="telephone=no">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-400.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-500.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-600.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-700.ttf) format("truetype")}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/Inter-800.ttf) format("truetype")}
:root{
  --bg:#05060a; --bg2:#0b0d13; --card:#0f1118; --card2:#151823; --line:rgba(255,255,255,.07);
  --text:#f5f7fb; --mute:#8d96aa; --dim:#5d6678; --green:#39ff88; --green-bg:rgba(57,255,136,.14);
  --red:#ff3b6b; --pink:#ff4fd8; --pill:#ffffff; --pill-text:#0a0c11; --track:#232938; --glow:0.22;
  --sniper:#ff9f0a; --vetter:#2f7bff; --spy:#a65cf0; --risk:#29b6c9; --blue:#3b8bff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#eef0f5; --bg2:#f5f6fa; --card:#ffffff; --card2:#f7f8fb; --line:rgba(10,12,17,.06);
  --text:#0b0d12; --mute:#7c8496; --dim:#aab0be; --green:#27c25f; --green-bg:rgba(39,194,95,.14);
  --pill:#0b0d12; --pill-text:#fff; --track:#e3e6ee; --glow:0.14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;display:flex;justify-content:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(520px 320px at 88% -40px,rgba(57,255,136,.09),transparent 70%),radial-gradient(460px 360px at -12% 55%,rgba(255,79,216,.07),transparent 70%),radial-gradient(420px 300px at 110% 92%,rgba(255,59,107,.06),transparent 70%)}
.app{position:relative;width:100%;max-width:430px;padding:calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 22px);display:flex;flex-direction:column;gap:13px}
.num{font-variant-numeric:tabular-nums}
/* practice banner */
.banner{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ffcf6b;background:rgba(255,159,10,.10);border:1px solid rgba(255,159,10,.28);border-radius:12px;padding:7px 10px;text-align:center}
.banner i{width:7px;height:7px;border-radius:50%;background:#ffb02e;box-shadow:0 0 10px #ffb02e}
body.light .banner{color:#9a5b00}
/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:2px 2px 0}
.hdr img{width:50px;height:50px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hdr h1{margin:0;font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.03em}
.hdr .sub{font-size:13px;color:var(--mute);margin-top:1px;font-weight:500}
.hdr .sp{flex:1}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.sim{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text)}
.sim b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.06em;background:var(--text);color:var(--bg);padding:2px 6px;border-radius:6px}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:#ffb02e}
/* ticker */
.ticker{overflow:hidden;margin:0 -12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk{display:flex;gap:10px;width:max-content;animation:tick 34s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
.tki{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.tki .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.tki .px{color:var(--mute);font-weight:500}
.chip{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--green-bg);color:var(--green)}
.chip.n{background:rgba(139,148,167,.16);color:var(--mute)}
.chip.b{background:rgba(59,139,255,.16);color:#6aa6ff}
/* equity */
.eq-top{display:flex;justify-content:space-between;align-items:center}
.eq-top span{font-size:15px;color:var(--mute);font-weight:500}
.mult{font-size:19px;font-weight:800;color:#06240f;background:var(--green);padding:6px 16px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 8px 26px rgba(48,210,106,calc(var(--glow)*1.6))}
.mult.down{background:var(--red);color:#2a0705;box-shadow:0 8px 26px rgba(255,90,82,.3)}
.odo{display:flex;align-items:flex-end;height:84px;margin-top:2px;font-weight:800;letter-spacing:-.04em}
.odo .big{display:flex;font-size:72px;line-height:1;height:1em;align-items:flex-start}
.odo .cts{display:flex;font-size:34px;line-height:1;height:1em;color:var(--dim);margin-bottom:6px;margin-left:3px;letter-spacing:-.02em}
.d{position:relative;width:.64em;height:1em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%)}
.cts .d{width:.62em}
.sep.pt{font-size:1em;color:var(--dim);margin:0 -.02em;align-self:flex-end}
.reel{display:flex;flex-direction:column;will-change:transform}
.reel span{display:block;height:1em;line-height:1;text-align:center}
.sep{display:block;line-height:1;padding:0 .02em}
.sep.dol{font-size:.92em;margin-right:.02em;color:var(--text)}
.sep.com{align-self:flex-end;margin:0 -.04em .12em;font-size:.8em}
.eq-sub{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:16px;font-weight:600;gap:8px}
.eq-sub .pl{display:flex;align-items:center;gap:8px;color:var(--green)}
.eq-sub .pl.z{color:var(--mute)}
.eq-sub .pl.neg{color:var(--red)}
.eq-sub .st{font-size:12.5px;white-space:nowrap;color:var(--mute);font-weight:500;text-align:right}
.streak{white-space:nowrap;font-size:12px;font-weight:800;color:#ffb347;background:rgba(255,159,10,.15);padding:3px 9px;border-radius:999px}
.spark{margin:6px -2px 0;height:70px}
.spark svg{width:100%;height:100%;overflow:visible}
.pulse{animation:pulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:13px 12px 11px;min-width:0;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 14%,transparent),0 12px 34px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent),0 2px 6px rgba(0,0,0,.25);
  opacity:0;transform:translateY(10px) scale(.98);animation:in .6s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:var(--dl)}
@keyframes in{to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(160px 80px at 0 0,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%)}
.ch{display:flex;align-items:center;gap:8px;position:relative}
.ico{width:32px;height:32px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ct{min-width:0;flex:1}
.ct b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:20px;white-space:nowrap}
.ct small{display:block;font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:28px;height:28px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dasharray 1.4s .5s cubic-bezier(.2,.8,.2,1)}
.mid{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:11px;min-height:28px;font-size:15px;font-weight:600;position:relative}
.mid .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .t em{font-style:normal;color:var(--mute);font-weight:500;font-size:12px}
.mid .t b{font-weight:800}
.pill{font-size:13px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.n{background:rgba(139,148,167,.16);color:var(--mute);font-weight:600}
.pill.b{background:rgba(59,139,255,.16);color:#6aa6ff}
.viz{height:38px;margin:6px 0 4px;position:relative}
.viz svg{width:100%;height:100%;overflow:visible}
.slots{display:flex;gap:5px;height:12px;margin-top:8px}
.slots i{flex:1;border-radius:6px;background:var(--track)}
.slots i.on{background:var(--c)}
.cap{height:6px;border-radius:6px;background:var(--track);margin-top:9px;overflow:hidden}
.cap i{display:block;height:100%;background:var(--c);border-radius:6px}
.cf{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);position:relative;margin-top:2px}
.cf .p{color:var(--mute);font-weight:700}
.cf .p.pos{color:var(--green)}
.cf .p.neg{color:var(--red)}
/* activity + goal */
.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:26px;padding:16px 16px 14px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ph h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ph span{font-size:13px;color:var(--mute);font-weight:500}
.feed{position:relative;min-height:296px;max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%)}
.row{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13.5px;line-height:1.35;animation:slide .55s cubic-bezier(.2,.9,.2,1);}
@keyframes slide{from{opacity:0;transform:translateY(-14px);max-height:0;padding-top:0;padding-bottom:0}to{opacity:1;transform:none;max-height:80px}}
.row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.row .tm{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--dim);margin-top:1.5px;flex:none}
.row .tx{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.row .tx b{font-weight:700}
.row .tx .d2{color:var(--mute)}
.row.old{opacity:.8}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.goal .gt span{font-size:13px;color:var(--mute);font-weight:500;text-align:right}
.goal .gt span.done{color:var(--blue);font-weight:700}
.gb{position:relative;height:74px;margin:6px 10px 0}
.gtrack{position:absolute;top:36px;left:-8px;right:-8px;height:12px;border-radius:9px;background:var(--track)}
.gfill{position:absolute;top:36px;left:-8px;height:12px;border-radius:9px;background:linear-gradient(90deg,#27b3c7,var(--green));width:0;transition:width 1.6s .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px rgba(48,210,106,.35)}
.gpill{position:absolute;top:2px;transform:translateX(-50%);background:var(--pill);color:var(--pill-text);font-size:13px;font-weight:800;padding:4px 11px;border-radius:999px;transition:left 1.6s .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.gpill.l{transform:translateX(-18px)}
.gm{position:absolute;top:32px;transform:translateX(-50%);text-align:center}
.gm i{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto;border:3px solid var(--track);background:var(--bg2)}
.gm.r i{border-color:var(--green);background:var(--bg2);box-shadow:0 0 0 3px rgba(48,210,106,.18)}
.gm.goal2 i{width:24px;height:24px;margin:-2px auto -2px;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,139,255,.2)}
.gm.goal2.r i{background:var(--blue);border-color:var(--blue)}
.gm span{display:block;margin-top:6px;font-size:12px;font-weight:600;color:var(--mute)}
.gm.r span{color:var(--green)}
.gm.goal2 span{margin-top:8px;color:var(--blue)}
.foot{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5;padding:0 8px}
.foot b{color:var(--mute)}
.err{background:rgba(255,90,82,.12);border:1px solid rgba(255,90,82,.4);color:#ff9d97;border-radius:14px;padding:12px;font-size:13px}
/* dynamic-island style toast */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 8px);transform:translate(-50%,-90px);width:min(402px,calc(100vw - 20px));background:#000;color:#fff;border-radius:999px;padding:10px 18px 10px 12px;display:flex;align-items:center;gap:12px;z-index:9;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 14px 40px rgba(0,0,0,.6);transition:transform .55s cubic-bezier(.2,1.1,.3,1)}
.toast.on{transform:translate(-50%,0)}
.toast .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .tt small{display:block;font-size:12px;color:#9aa3b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .v{font-size:19px;font-weight:800;color:#e8ecf5}

/* live / open trades / history */
.ld{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.6s ease-in-out infinite;margin-right:6px;vertical-align:middle}
.ld.off{background:var(--red);box-shadow:none;animation:none}.ld.stale{background:#ffb02e;box-shadow:0 0 8px #ffb02e}
@keyframes blink{50%{opacity:.35}}
.chip.r{background:rgba(255,90,82,.16);color:var(--red)}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--mute)}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:11px 14px;border-radius:20px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(48,210,106,.10),0 10px 28px rgba(48,210,106,.10)}
.lb-k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.lb-s{font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:500}
.lb-s b{font-weight:700}
.lb-r{text-align:right;min-width:0}
.lb-v{font-size:27px;line-height:30px;font-weight:800;letter-spacing:-.03em}
.lb-d{font-size:13px;font-weight:700;margin-top:2px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.tl{max-height:430px;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px}
.tr{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.tr:first-child{border-top:0;padding-top:4px}
.tr .m{flex:1;min-width:0}
.tr .n{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.tr .n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
a.lk{color:var(--blue);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.tr .s{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.35;font-weight:500}
.tr .s b{color:var(--text);font-weight:700}
.tr .v{text-align:right;flex:none}
.tr .pv{font-size:17px;font-weight:800;letter-spacing:-.02em}
.tr .pp{margin-top:4px}
.tr .pp .chip{display:inline-block}
.tr .na{color:var(--mute);font-weight:600}
.empty{font-size:13.5px;color:var(--mute);padding:6px 0 4px}
.scan{font-size:13px;color:var(--mute);font-weight:500;white-space:nowrap}
.scan b{color:var(--text);font-weight:700}
.feed{max-height:400px;overflow-y:auto;overscroll-behavior:contain;-webkit-mask-image:none;mask-image:none;min-height:0}
.row .tm{min-width:40px}
.row.fresh .tx{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:rgba(59,139,255,.22)}100%{background:transparent}}
.row .lk{margin-left:4px}
.re .card{animation:none;opacity:1;transform:none}
.re .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
.re .ring .fg,.re .gfill,.re .gpill{transition:none}

/* compact equity + mascot */
.eqrow{display:flex;align-items:center;gap:6px}
.eqleft{flex:1;min-width:0}
.eq-top{gap:10px;justify-content:flex-start}
.eq-top span{font-size:13px;white-space:nowrap}
.mult{font-size:14px;padding:3px 10px;border-radius:11px}
.odo{height:56px;margin-top:4px}
.odo .big{font-size:50px}
.odo .cts{font-size:25px;margin-bottom:4px;margin-left:2px}
.eq-sub{flex-direction:column;align-items:flex-start;gap:3px;margin-top:3px;font-size:14.5px}
.eq-sub .st{font-size:12px;text-align:left}
.streak{font-size:11px;padding:2px 8px}
.mascot{width:104px;height:116px;flex:none;margin-right:-4px;cursor:pointer;position:relative}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .all{transform-origin:50px 100px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.012,.99)}}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.mascot .happy,.mascot .mo,.mascot .wr,.mascot .sweat,.mascot .spk{opacity:0}
.mascot .sm{opacity:1}
.mascot[data-mood="sweat"] .sm,.mascot.ouch .sm{opacity:0}
.mascot[data-mood="sweat"] .wr,.mascot.ouch .wr{opacity:1}
.mascot[data-mood="sweat"] .sweat,.mascot.ouch .sweat{opacity:1;animation:drip 1.8s ease-in infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}15%{opacity:1}100%{transform:translateY(12px);opacity:0}}
.mascot[data-mood="sweat"] .brow,.mascot.ouch .brow{opacity:1}
.mascot .brow{opacity:0}
.mascot.cheer .all{animation:hop .62s cubic-bezier(.3,.7,.4,1) 4}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.9)}45%{transform:translateY(-16px) scale(.96,1.06)}}
.mascot.cheer .eye{opacity:0}.mascot.cheer .happy{opacity:1}
.mascot.cheer .sm{opacity:0}.mascot.cheer .mo{opacity:1}
.mascot.cheer .spk{opacity:1;animation:spk .6s ease-in-out infinite alternate}
@keyframes spk{from{transform:scale(.7)}to{transform:scale(1.15)}}
.mascot.ouch .all{animation:shake .45s 3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mascot .spk{transform-box:fill-box;transform-origin:center}

    if(!evs.length)feed.innerHTML='<div class="empty">No events yet.</div>';
    return;
  }
  var fresh=evs.filter(function(f){return !seen[f.id]});
  if(!fresh.length)return;
  var emp=feed.querySelector(".empty");if(emp)emp.remove();
  fresh.slice().reverse().forEach(function(f){seen[f.id]=1;feed.insertBefore(evRow(f,true),feed.firstChild)});
  var pl=function(f){var m=f.kind==="sell"&&String(f.text).match(/P&L \$([+-][\d.]+)/);return m?parseFloat(m[1]):0};
  var sells=fresh.filter(function(f){return f.kind==="sell"});
  if(sells.some(function(f){return pl(f)>0}))react("cheer");else if(sells.some(function(f){return pl(f)<0}))react("ouch");
  var notable=fresh.filter(function(f){return f.kind==="buy"||f.kind==="sell"});
  if(notable.length&&!STILL)toast(notable[0]);
  while(feed.children.length>120)feed.removeChild(feed.lastChild);
}
function toast(f){
  var role=roleOf(f),c=COLORS[role],t=$("#toast"),buy=f.kind==="buy";
  var m=buy?(f.text.match(/\$([\d.]+)/)||[])[1]:(f.text.match(/P&L \$([+-][\d.]+)/)||[])[1];
  t.innerHTML='<div class="av" style="background:'+c+';width:38px;height:38px">'+esc(f.coin.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase())+'</div><div class="tt"><b>'+role+(buy?' bought ':' sold ')+esc(short(f.coin))+'</b><small>paper trade · '+esc((f.why||"").slice(0,48))+'</small></div><div class="v num">'+(m?esc((buy?"$":"")+m):"")+'</div>';
  t.classList.add("on");clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("on")},3200);
}

/* ---------- clocks (1 s): held, last-scan, update ages ---------- */
function tickClock(){
  var now=Date.now();
  document.querySelectorAll(".held").forEach(function(e){var o=Date.parse(e.getAttribute("data-o"));e.textContent=isFinite(o)?dur((now-o)/1000):"—"});
  var ls=D&&D.last_scan?Date.parse(D.last_scan):NaN;
  document.querySelectorAll(".scanago").forEach(function(se){se.textContent=isFinite(ls)?ago(ls):"never"});
  document.querySelectorAll(".scandot").forEach(function(sd){var mins=(now-ls)/60000;sd.className="ld scandot"+(!isFinite(ls)||mins>40?" off":mins>25?" stale":"")});
  var su=$("#sfupd");if(su)su.textContent=LAST.good?ago(LAST.good):"…";
  ["upd","upd2"].forEach(function(id){var e=document.getElementById(id);if(e&&LAST.good)e.textContent=ago(LAST.good)});
}

/* ---------- shell + data + PWA ---------- */
var PG=[
 ["overview","Overview","Balance, desk funnel and log",'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>'],
 ["trades","Trades","Open trades and desk log",'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>'],
 ["history","History","Closed trades",'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'] 
],PIDS=PG.map(function(p){return p[0]});
function curPage(){
  var h=(location.hash||"").replace(/^#\/?/,"").toLowerCase();if(h==="desk"||h==="stats"||h==="coins")h="overview";if(h==="positions"||h==="activity")h="trades";
  if(PIDS.indexOf(h)>=0)return h;
  var v=(qs.get("view")||"").toLowerCase();if(v==="desk"||v==="stats"||v==="coins")v="overview";if(v==="positions"||v==="activity")v="trades";
  return PIDS.indexOf(v)>=0?v:"overview";
}
function setNav(open){var a=$("#app");if(!a)return;a.classList.toggle("nav",!!open);var m=$("#menu");if(m)m.setAttribute("aria-expanded",open?"true":"false")}
function route(){
  var p=curPage();VIEW=p;
  var rh=location.hash?location.hash.replace(/^#\/?/,"").toLowerCase():"";if(history.replaceState){if(rh==="stats"||rh==="coins")history.replaceState(null,"","#overview");else if(rh==="positions"||rh==="activity")history.replaceState(null,"","#trades")}
  document.querySelectorAll(".pg").forEach(function(e){e.classList.toggle("on",e.id==="pg-"+p)});
  document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-p")===p)});
  var m=PG[PIDS.indexOf(p)];$("#ptitle").textContent=m[1];$("#psub").textContent=m[2];
  document.title=m[1]+" · Paper Desk";setNav(false);
  var pg=$("#pg-"+p);if(pg)pg.scrollTop=0;
}
function setView(v){location.hash="#"+v}
function shell(){
  var nav=PG.map(function(p){return '<a href="#'+p[0]+'" data-p="'+p[0]+'">'+p[3]+'<span>'+p[1]+'</span><i class="bd" id="bd-'+p[0]+'"></i></a>'}).join("");
  $("#app").innerHTML='<aside class="side" id="side" aria-label="Menu"><div class="brand"><img src="icons/icon-192.png" alt=""><div><b>Paper Desk</b><small>Memecoins · 5 max open</small></div></div>'
  +'<div class="ptag"><i></i>Practice money · no real funds</div><nav class="nav" id="nav">'+nav+'</nav>'
  +'<div class="sfoot"><div><i class="ld scandot"></i>last scan <b class="scanago">…</b></div><div>Live prices <span id="sfupd">…</span></div></div></aside>'
  +'<div class="scrim" id="scrim"></div>'
  +'<main class="main"><header class="top"><button class="menu" id="menu" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><div><h1 id="ptitle"></h1><div class="sub" id="psub"></div></div><div class="sp"></div><span class="pchip">PRACTICE</span></header>'
  +'<div class="pages">'
  +'<section class="pg" id="pg-overview"><div class="hero" id="hero"><div class="tkr"><div class="tklive" id="tklive"></div><div class="ticker" id="ticker"></div></div>'
   +'<div class="hrow"><div class="hl"><div class="hcap" id="eqtop"></div><div class="odo" id="odo"></div></div><div class="hr" id="hpills"></div></div>'
   +'<div class="hsub" id="eqsub"></div><div class="spark" id="spark"></div><div class="hgoal" id="goalp"></div></div>'
   +'<div class="fcard" id="funnel"></div><div class="fcard" id="dlog"></div><div class="fcard" id="skips"></div>'
   +'<details class="rules panel"><summary>Rules &amp; notes ▾</summary><div class="foot" id="foot"></div></details></section>'
  +'<section class="pg" id="pg-trades"><div class="fill tpage"><div class="panel" id="openp"></div><div class="panel tp-act"><div class="ph"><span><i class="ld scandot"></i>last scan <b class="scanago">…</b></span></div><div class="feed all" id="feed"></div><button class="more" id="feedmore" data-more="feed"></button></div></div></section>'
  +'<section class="pg" id="pg-history"><div class="panel fill" id="histp"></div></section>'
  +'</div></main>';
  $("#menu").addEventListener("click",function(){setNav(!$("#app").classList.contains("nav"))});
  $("#scrim").addEventListener("click",function(){setNav(false)});
  $("#nav").addEventListener("click",function(e){if(e.target.closest("a"))setNav(false)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")setNav(false)});
  var tx=null,ty=0;
  document.addEventListener("touchstart",function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
  document.addEventListener("touchend",function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);
    if(dy<50&&window.innerWidth<900&&!SH.open){if(tx<26&&dx>70)setNav(true);else if(dx<-70)setNav(false)}tx=null},{passive:true});
  document.addEventListener("click",function(e){var b=e.target.closest("button[data-more]");if(!b)return;var k=b.getAttribute("data-more");
    if(k==="feed")$("#feed").classList.toggle("all");else if(k==="hist"){HLIM+=20;buildHist(D)}
    feedMore()});
  window.addEventListener("hashchange",route);route();
  odo=new Odo($("#odo"));
  initSheet();
}
function feedMore(){
  var f=$("#feed"),b=$("#feedmore");if(!f||!b)return;var n=f.querySelectorAll(".row").length,all=f.classList.contains("all");
  b.style.display=n>15?"":"none";b.textContent=all?"Show latest only":"Show all "+n;
}
function fnum(n){return (+n||0).toLocaleString("en-US")}
function tkHtml(d){
  var o=d.open_positions||[];if(!o.length)return '<div class="tk0">no open coins · last scan <b class="scanago">…</b></div>';
  var item=function(p){return '<span class="tki" data-tk="'+esc(p.pair)+'">'+avatar(p.coin,18)+'<b>'+esc(short(p.coin))+'</b><span class="tkp num">$'+px(p.entry)+'</span><span class="chip n tkc">entry · '+usd(p.size)+'</span></span>'};
  var k=Math.max(1,Math.ceil(4/o.length)),h="";for(var i=0;i<k;i++)h+=o.map(item).join("");
  return '<div class="tk">'+h+h+'</div>';
}
function buildTicker(d){
  var key=(d.open_positions||[]).map(function(p){return p.pair}).join(",");
  var el=$("#ticker");if(!el||el.getAttribute("data-k")===key)return;el.setAttribute("data-k",key);el.innerHTML=tkHtml(d);paintLive();
}
function evTs(x){var m=Date.parse(x);return isFinite(m)?m:0}
function lastAct(d,key){
  var c=[];
  (d.open_positions||[]).forEach(function(p){if((p.role||"SNIPER")===key)c.push({ts:evTs(p.opened),h:'<b>$'+esc(short(p.coin))+'</b> <span data-fl="'+esc(p.pair)+'" class="zero">holding</span>'})});
  (d.closed_trades||[]).forEach(function(t){if(t.role===key)c.push({ts:evTs(t.ts),h:'<b>$'+esc(short(t.coin))+'</b> sold <span class="'+(t.pnl>0?"pos":t.pnl<0?"neg":"zero")+'">'+sgn(t.pnl)+'</span>'})});
  c.sort(function(a,b){return b.ts-a.ts});return c.length?c[0].h:'<span class="zero">no trades yet</span>';
}
function sg0(v){return (v>=0?"+":"−")+"$"+Math.abs(v).toFixed(0)}
function bestWorst(d){
  var v=(d.closed_trades||[]).filter(function(t){return t.final}).map(function(t){return t.position_total!=null?t.position_total:t.pnl});
  return v.length?{best:Math.max.apply(null,v),worst:Math.min.apply(null,v)}:null;
}
function buildFunnel(d){
  var R=d.roles||{},bw=bestWorst(d),cap=d.open_cap||CAP_DEFAULT;
  var bought=0;["SNIPER","MOMENTUM","DIP_HUNTER"].forEach(function(k){bought+=(R[k]&&R[k].entries)||0});
  var vl=(d.vetter_log||[])[0],rj=(d.feed||[]).filter(function(f){return f.kind==="reject"})[0];
  var vAct='<span class="zero">nothing vetted yet</span>';
  var vt=vl?evTs(vl.ts):0,rt=rj?evTs(rj.ts):0;
  if(vl&&vt>=rt)vAct='<b>'+(vl.verdict==="SKIP"?"killed":"passed")+' $'+esc(short(vl.coin.trim()))+'</b> <span class="'+(vl.verdict==="SKIP"?"bad":"pos")+'">'+(vl.verdict==="SKIP"?"× ":"")+esc(vl.short)+'</span>';
  else if(rj)vAct='<b>killed '+esc(short(rj.coin))+'</b> <span class="bad">× '+esc(rj.why)+'</span>';
  var sell=(d.feed||[]).filter(function(f){return f.kind==="sell"})[0];
  var rAct=d.halt?'<b class="neg">halted</b> <span class="bad">loss cap hit</span>':sell?'<b>sold '+esc(short(sell.coin))+'</b> <span class="zero">'+esc(sell.why||"")+'</span>':'<b class="pos">all clear</b> <span class="zero">'+d.open_count+'/'+cap+' open</span>';
  var rows=[
   ["Sniper","fresh pairs",lastAct(d,"SNIPER"),'<span class="fp o">'+kfmt(d.scanned)+' seen</span>'],
   ["Vetter","safety gates",vAct,'<span class="fp r">'+kfmt(d.rejected)+' killed</span>'],
   ["Spy","smart wallets",d.wallets_tracked?'<b>tracking '+d.wallets_tracked+' wallets</b>':'<span class="zero">idle · no wallets tracked</span>','<span class="fp p">'+d.wallets_tracked+' wallets</span>'],
   ["Momentum","breakouts",lastAct(d,"MOMENTUM"),'<span class="fp g">'+((R.MOMENTUM&&R.MOMENTUM.entries)||0)+' bought</span>'],
   ["Dip Hunter","dip bounces",lastAct(d,"DIP_HUNTER"),'<span class="fp g">'+((R.DIP_HUNTER&&R.DIP_HUNTER.entries)||0)+' bought</span>'],
   ["Risk Manager","stops &amp; caps",rAct,'<span class="fp k">'+(bw&&bw.worst<0?'max loss '+sgn(bw.worst):'no losses')+'</span>']
  ];
  $("#funnel").innerHTML='<div class="fh"><h3>Desk funnel</h3><span><b>'+fnum(d.scanned)+'</b> checked · <b class="pos">'+bought+'</b> bought</span></div>'
   +rows.map(function(r){var c=COLORS[r[0]];return '<div class="fr'+(r[0]==="Risk Manager"&&d.halt?" hot":"")+'" style="--c:'+c+'"><div class="ico">'+ICON[r[0]]+'</div><div class="nm"><b>'+r[0]+'</b><small>'+r[1]+'</small></div><div class="ac">'+r[2]+'</div>'+r[3]+'</div>'}).join("");
}
function buildLog(d){
  var ev=[];
  (d.feed||[]).filter(function(f){return f.id}).forEach(function(f){
    var role=roleOf(f),act=f.kind==="buy"?"bought":f.kind==="sell"?"sold":"killed";
    var det=f.kind==="reject"?'× '+f.why:f.kind==="sell"?(f.text.match(/P&L \$([+-][\d.]+)/)||[])[1]?(f.text.match(/P&L \$([+-][\d.]+)/)[1].replace(/^([+-])/,"$1$")+" · "+f.why):f.why:f.why;
    ev.push({ts:evTs(f.ts||f.t),role:role,act:act,coin:(f.kind==="buy"?"$":"")+short(f.coin),det:det,bad:f.kind==="reject"});
  });
  (d.vetter_log||[]).slice(0,6).forEach(function(v){ev.push({ts:evTs(v.ts),role:"Vetter",act:v.verdict==="SKIP"?"killed":"passed",coin:"$"+v.coin.trim(),det:(v.verdict==="SKIP"?"× ":"")+v.short,bad:v.verdict==="SKIP"})});
  ev.sort(function(a,b){return b.ts-a.ts});ev=ev.slice(0,16);
  $("#dlog").innerHTML='<div class="fh"><h3>Desk log</h3><span><i class="ld scandot"></i>scan <b class="scanago">…</b> ago</span></div><div class="lgb">'
   +(ev.length?ev.map(function(e){var c=COLORS[e.role];return '<div class="lr"><i style="background:'+c+'"></i><span class="tm">'+esc(fmtT(new Date(e.ts).toISOString()))+'</span><span class="tx"><b style="color:'+c+'">'+e.role+'</b> <b>'+e.act+' '+esc(e.coin)+'</b> <span class="'+(e.bad?"bad":"zero")+'">· '+esc(e.det)+'</span></span></div>'}).join(""):'<div class="empty">No events yet.</div>')+'</div>';
}
function buildSkips(d){
  var sr=d.skip_reasons||[],mx=sr.reduce(function(a,x){return Math.max(a,x.n)},1),bw=bestWorst(d);
  $("#skips").innerHTML='<div class="fh"><h3>Why coins got skipped</h3><span>'+(bw?'best <b class="pos">'+sg0(bw.best)+'</b> · worst <b class="neg">'+sg0(bw.worst)+'</b>':'no closed trades yet')+'</span></div>'
   +(sr.length?'<div class="skg">'+sr.slice(0,8).map(function(x){return '<div class="sk"><div><span>'+esc(x.label)+'</span><b>'+fnum(x.n)+'</b></div><i><u style="width:'+Math.max(6,x.n/mx*100)+'%"></u></i></div>'}).join("")+'</div><div class="skn">from vetted.csv · '+d.vetted_total+' coins vetted</div>':'<div class="empty">No skipped coins logged yet.</div>');
}
function buildDesk(d){
  buildTicker(d);buildFunnel(d);buildLog(d);buildSkips(d);
  function bd(id,v){var e=$("#bd-"+id);if(e)e.textContent=v?String(v):""}
  bd("trades",d.open_count);bd("history",(d.closed_trades||[]).length);
  tickClock();
}
function show(d){
  var sig=JSON.stringify(d);
  if(sig===lastSig)return;
  lastSig=sig;
  var oldKey=openList().map(function(p){return p.pair}).join(",");
  D=d;
  if(first)shell();
  renderTop(d);setMood(d);
  var newKey=openList().map(function(p){return p.pair}).join(",");
  if(first||oldKey!==newKey||!$("#oplist"))buildOpen(d);else paintLive();
  buildHist(d);buildDesk(d);
  updateFeed(d);feedMore();
  tickClock();
  if(first){document.body.classList.remove("re");first=false;document.body.classList.add("re")}
  if(oldKey!==newKey)fetchLive();
}
function fail(e){
  if(D)return;   /* keep showing the last good data when a refresh fails */
  $("#app").innerHTML='<div class="banner"><i></i>PRACTICE MONEY · PAPER TRADING</div><div class="err">Could not load data.json ('+esc(e&&e.message||e)+'). Serve this folder over http(s) and keep data.json next to index.html.</div>';
}
function load(){
  getJSON("data.json?ts="+Date.now(),10000).then(show).catch(fail);
}
setInterval(tickClock,1000);
if(window.__DATA__){show(window.__DATA__)}
else{
  load();setInterval(load,30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){load();fetchLive()}});
  if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
}
setInterval(fetchLive,12000);
})();
</script>
